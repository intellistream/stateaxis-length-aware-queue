[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "stateaxis-length-aware-queue"
version = "0.2.0"
description = "ECPA-bound StateAxis cold-prefill length-class and aging authority"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8", "ruff>=0.12", "vllm-hust-ext>=0.3,<0.4"]

[project.entry-points."vllm_hust.extension_bundles"]
"org.vllm-hust.stateaxis-length-aware-queue" = "stateaxis_length_aware_queue"

[project.entry-points."stateaxis.mod_handlers"]
length_aware_queue = "stateaxis_length_aware_queue:length_aware_queue"

[tool.hatch.build.targets.wheel]
packages = ["src/stateaxis_length_aware_queue"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
